ServerRoot "/usr/local"
ServerName localhost:24496
Listen 127.0.0.1:24496

LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule alias_module libexec/apache24/mod_alias.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so

PidFile "/home/studs/s501226/httpd-root/httpd.pid"
DefaultRuntimeDir "/home/studs/s501226/httpd-root/logs"
ErrorLog "/home/studs/s501226/httpd-root/logs/error.log"
LogLevel warn
Mutex default:/home/studs/s501226/httpd-root/mutex-dir/

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/home/studs/s501226/httpd-root/public"
<Directory "/home/studs/s501226/httpd-root/public">
    Options None
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html
TypesConfig etc/apache24/mime.types
AddDefaultCharset UTF-8

FastCgiIpcDir "/home/studs/s501226/httpd-root/logs/fastcgi"
FastCgiExternalServer "/home/studs/s501226/httpd-root/fcgi-bin/app.jar" -host 127.0.0.1:24497 -nph
Alias /fcgi-bin/ "/home/studs/s501226/httpd-root/fcgi-bin/"
<Directory "/home/studs/s501226/httpd-root/fcgi-bin">
    Options None
    AllowOverride None
    Require all granted
</Directory>
